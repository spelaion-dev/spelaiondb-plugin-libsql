# What every pull request and every push to `main` must pass: the checks every plugin of
# SpelaionDB shares, kept in the template's repository and called by commit. A change there
# reaches this plugin when this file moves the commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: spelaion-dev/spelaiondb-plugin-template/.github/workflows/plugin-ci.yml@011250b107ce4a775c1dd94579c8aa36d9887a15
    with:
      # Where ci/services.sh put the servers: without authentication, with tokens, and behind
      # TLS. On Windows there is none: the tests that need them are skipped there, saying so.
      test-env: |
        SPELAION_TEST_LIBSQL=127.0.0.1:18091
        SPELAION_TEST_LIBSQL_AUTH=127.0.0.1:18092
        SPELAION_TEST_LIBSQL_TLS=127.0.0.1:18493
